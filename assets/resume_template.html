<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{NAME}} — {{TARGET_HEADLINE}}</title>
  <style>
    @page {
      size: letter;
      margin: 0.45in 0.5in;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Charter", "Georgia", "Times New Roman", Times, serif;
      font-size: 10pt;
      line-height: 1.32;
      color: #111111;
      background: #ffffff;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    a {
      color: #111111;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
      padding-bottom: 4px;
    }
    .name {
      font-size: 18pt;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .headline {
      font-size: 10.5pt;
      font-weight: 600;
      color: #222222;
      margin-bottom: 3px;
    }
    .contact-bar {
      font-size: 9.2pt;
      color: #222222;
    }
    .contact-bar span + span::before {
      content: "  |  ";
      color: #555555;
    }
    .section {
      margin-top: 8px;
    }
    .section-title {
      font-size: 10.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid #111111;
      padding-bottom: 1.5px;
      margin-bottom: 5px;
    }
    .summary-text {
      font-size: 9.8pt;
      text-align: justify;
    }
    .skills-list {
      font-size: 9.6pt;
    }
    .skill-row {
      margin-bottom: 2px;
    }
    .skill-cat {
      font-weight: 700;
    }
    .entry {
      margin-bottom: 6px;
      page-break-inside: avoid;
    }
    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-weight: 700;
      font-size: 10pt;
    }
    .entry-sub {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-style: italic;
      font-size: 9.5pt;
      color: #222222;
      margin-bottom: 2px;
    }
    ul.bullets {
      margin-left: 16px;
      font-size: 9.6pt;
    }
    ul.bullets li {
      margin-bottom: 1.8px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="name">{{NAME}}</div>
    {{HEADLINE_BLOCK}}
    <div class="contact-bar">
      {{CONTACT_ITEMS}}
    </div>
  </header>

  {{SUMMARY_SECTION}}
  {{SKILLS_SECTION}}
  {{EXPERIENCE_SECTION}}
  {{PROJECTS_SECTION}}
  {{EDUCATION_SECTION}}
  {{CERTIFICATIONS_SECTION}}
</body>
</html>
